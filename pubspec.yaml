name: climbing_companion
description: "A mobile app Developed in Flutter to help climbers track their climbing sessions, progress, and goals. The app will allow users to log their climbs, set goals, and view their progress over time."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  graphic: ^2.7.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.1.0
  image_picker: ^1.0.0
  flutter_colorpicker: ^1.1.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/
